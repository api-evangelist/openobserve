aid: openobserve
name: OpenObserve
description: >-
  OpenObserve is an open source petabyte-scale observability platform with unified logs, metrics, traces, and front-end
  telemetry in a single UI with SQL and PromQL querying. The HTTP API exposes ingestion, search, alerting, dashboards,
  pipelines, RUM, and administration endpoints.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/openobserve.png
url: https://raw.githubusercontent.com/api-evangelist/openobserve/refs/heads/main/apis.yml
